quarkus.http.port=8080
quarkus.grpc.server.port=9090
quarkus.grpc.server.host=0.0.0.0
quarkus.http.host=0.0.0.0
quarkus.micrometer.export.prometheus.enabled=true
jafra.ingest.max-metadata-length=4096
jafra.ingest.max-active-streams=32
jafra.storage.root=/var/lib/jafra/analyzer
%test.jafra.storage.root=target/jafra-analyzer-storage
# Threads that read each stored chunk and widen its event time range. Default 1.
jafra.index.decode-threads=1
# How often stored chunks with no decoded_at are offered to the decoder. Default 1m.
jafra.index.decode-rescan=1m
# Optional. Unset disables deletion. Example: jafra.storage.retention=48h
# Threads that roll each stored chunk into v2.duckdb. Default 1.
jafra.v2.rollup-threads=1
# How often stored chunks with no v2 window are offered. Default 1m.
jafra.v2.rollup-rescan=1m
# proposal, pending KUSMA. async-profiler lock sampling interval in milliseconds. UNVERIFIED.
jafra.v2.ap.lock-interval-ms=10
# proposal, pending KUSMA. long_pause warning floor in milliseconds.
jafra.v2.detect.long-pause.warning-ms=200
# proposal, pending KUSMA. long_pause critical floor in milliseconds.
jafra.v2.detect.long-pause.critical-ms=1000
# proposal, pending KUSMA. heap_near_full warning occupancy percent.
jafra.v2.detect.heap-near-full.warning-pct=85
# proposal, pending KUSMA. heap_near_full critical occupancy percent.
jafra.v2.detect.heap-near-full.critical-pct=95
# proposal, pending KUSMA; container_near_limit's Warning band in step 3 must read this same key
jafra.v2.detect.container-near-limit.warning-pct=90
# proposal, pending KUSMA. gc_overhead warning and critical percent of time.
jafra.v2.detect.gc-overhead.warning-pct=10
# proposal, pending KUSMA. gc_overhead critical percent of time.
jafra.v2.detect.gc-overhead.critical-pct=25
# proposal, pending KUSMA. full GCs in the last N windows that make full_gc critical.
jafra.v2.detect.full-gc.critical-count=3
# proposal, pending KUSMA. windows full_gc looks back, including the current one.
jafra.v2.detect.full-gc.window-count=12
# proposal, pending KUSMA. zgc_alloc_stall critical when stall time is this percent of the window.
jafra.v2.detect.zgc-alloc-stall.critical-pct=1
# proposal, pending KUSMA. MethodTiming mode: AUTO, CUMULATIVE, or PER_PERIOD.
jafra.v2.detect.method-timing.mode=AUTO
# proposal, pending KUSMA. old_gen_rising time-to-full warning and critical, minutes.
jafra.v2.detect.old-gen-rising.warning-min=60
# proposal, pending KUSMA. old_gen_rising critical time-to-full, minutes.
jafra.v2.detect.old-gen-rising.critical-min=10
# proposal, pending KUSMA. old_gen_rising also critical at this occupancy with a significant rise.
jafra.v2.detect.old-gen-rising.occupancy-pct=90
# proposal, pending KUSMA. alloc_spike robust z.
jafra.v2.detect.alloc-spike.z=4
# proposal, pending KUSMA. alloc_spike multiple of the baseline median.
jafra.v2.detect.alloc-spike.multiple=2
# proposal, pending KUSMA. container_near_limit critical usage percent.
jafra.v2.detect.container-near-limit.critical-pct=97
# proposal, pending KUSMA. overcommitted_config heap times this factor versus the pod limit.
jafra.v2.detect.overcommitted-config.heap-factor=1.25
# proposal, pending KUSMA. overcommitted_config target heap share of the pod limit.
jafra.v2.detect.overcommitted-config.heap-share=0.8
# proposal, pending KUSMA. metaspace_growth warning headroom, minutes.
jafra.v2.detect.metaspace-growth.warning-headroom-min=60
# proposal, pending KUSMA. loader_leak minimum points.
jafra.v2.detect.loader-leak.min-points=30
# proposal, pending KUSMA. direct_buffer_leak warning percent of the limit.
jafra.v2.detect.direct-buffer-leak.warning-pct=80
# proposal, pending KUSMA. direct_buffer_leak critical percent of the limit.
jafra.v2.detect.direct-buffer-leak.critical-pct=95
# proposal, pending KUSMA. native_growth warning slope as a percent of the pod limit per hour.
jafra.v2.detect.native-growth.warning-slope-pct=10
# proposal, pending KUSMA. native_growth critical pod-limit headroom, minutes.
jafra.v2.detect.native-growth.critical-headroom-min=15
# proposal, pending KUSMA. cpu_throttling warning percent of periods.
jafra.v2.detect.cpu-throttling.warning-pct=25
# proposal, pending KUSMA. cpu_throttling critical percent of periods.
jafra.v2.detect.cpu-throttling.critical-pct=50
# proposal, pending KUSMA. cpu_throttling critical throttled seconds per second.
jafra.v2.detect.cpu-throttling.critical-seconds=0.2
# proposal, pending KUSMA. cpu_saturation warning percent of the CPU limit.
jafra.v2.detect.cpu-saturation.warning-pct=90
# proposal, pending KUSMA. cpu_saturation critical percent of the CPU limit.
jafra.v2.detect.cpu-saturation.critical-pct=98
# proposal, pending KUSMA. cpu_saturation also needs this throttled percent to be critical.
jafra.v2.detect.cpu-saturation.throttle-pct=25
# proposal, pending KUSMA. cpu_jump robust z.
jafra.v2.detect.cpu-jump.z=4
# proposal, pending KUSMA. cpu_jump multiple of the baseline median.
jafra.v2.detect.cpu-jump.multiple=1.5
# proposal, pending KUSMA. hot_frame_shift Jensen-Shannon distance.
jafra.v2.detect.hot-frame-shift.distance=0.3
# proposal, pending KUSMA. hot_frame_shift CPU multiple of the baseline median.
jafra.v2.detect.hot-frame-shift.cpu-multiple=1.3
# proposal, pending KUSMA. hot_frame_shift minimum samples.
jafra.v2.detect.hot-frame-shift.min-samples=200
# proposal, pending KUSMA. lock_contention warning thread-seconds per second.
jafra.v2.detect.lock-contention.warning-thread-s=0.5
# proposal, pending KUSMA. lock_contention critical thread-seconds per second.
jafra.v2.detect.lock-contention.critical-thread-s=2
# proposal, pending KUSMA. lock_contention robust z for the warning band.
jafra.v2.detect.lock-contention.z=4
# proposal, pending KUSMA. lock wait formula: raw or corrected. UNVERIFIED.
jafra.v2.detect.lock-contention.wait-formula=raw
# proposal, pending KUSMA. async-profiler lock interval, low profile, milliseconds. UNVERIFIED.
jafra.v2.detect.lock-contention.interval-low-ms=10
# proposal, pending KUSMA. async-profiler lock interval, medium profile, milliseconds. UNVERIFIED.
jafra.v2.detect.lock-contention.interval-medium-ms=1
# proposal, pending KUSMA. async-profiler lock interval, aggressive profile, milliseconds. UNVERIFIED.
jafra.v2.detect.lock-contention.interval-aggressive-ms=0.1
# proposal, pending KUSMA. idle park frames dropped from lock and pool samples. UNVERIFIED.
jafra.v2.detect.lock-contention.idle-frames=java.util.concurrent.ThreadPoolExecutor.getTask,java.util.concurrent.ForkJoinPool.awaitWork,java.util.concurrent.SynchronousQueue
# proposal, pending KUSMA. single_hot_lock share of filtered wait.
jafra.v2.detect.single-hot-lock.share-pct=60
# proposal, pending KUSMA. single_hot_lock minimum thread-seconds per second.
jafra.v2.detect.single-hot-lock.min-thread-s=0.5
# proposal, pending KUSMA. single_hot_lock minimum lock samples.
jafra.v2.detect.single-hot-lock.min-samples=50
# proposal, pending KUSMA. thread_churn warning threads per second.
jafra.v2.detect.thread-churn.warning-per-s=20
# proposal, pending KUSMA. thread_churn critical threads per second.
jafra.v2.detect.thread-churn.critical-per-s=100
# proposal, pending KUSMA. thread_churn robust z.
jafra.v2.detect.thread-churn.z=4
# proposal, pending KUSMA. thread_leak multiple of the first live count.
jafra.v2.detect.thread-leak.multiple=2
# proposal, pending KUSMA. thread_leak windows of live-count trend.
jafra.v2.detect.thread-leak.windows=60
# proposal, pending KUSMA. pool_saturation busy share. The detector never emits Critical.
jafra.v2.detect.pool-saturation.warning-pct=95
# proposal, pending KUSMA. pool_saturation minimum wall samples.
jafra.v2.detect.pool-saturation.min-samples=100
# proposal, pending KUSMA. request-pool thread name prefixes, including qtp and XNIO-.
jafra.v2.detect.pool-saturation.prefixes=http-nio-,executor-thread-,exec-,qtp,XNIO-
# proposal, pending KUSMA. extra idle frames for pool busy share. UNVERIFIED.
jafra.v2.detect.pool-saturation.idle-frames=org.apache.tomcat.util.threads.TaskQueue.take,org.apache.tomcat.util.threads.TaskQueue.poll
# proposal, pending KUSMA. event_loop_blocked warning percent.
jafra.v2.detect.event-loop-blocked.warning-pct=20
# proposal, pending KUSMA. event_loop_blocked critical percent.
jafra.v2.detect.event-loop-blocked.critical-pct=50
# proposal, pending KUSMA. event_loop_blocked minimum wall samples.
jafra.v2.detect.event-loop-blocked.min-samples=100
# proposal, pending KUSMA. event-loop prefixes, including nioEventLoopGroup- and epollEventLoopGroup-.
jafra.v2.detect.event-loop-blocked.prefixes=vert.x-eventloop-thread-,reactor-http-nio-,nioEventLoopGroup-,epollEventLoopGroup-
# proposal, pending KUSMA. selector frames excluded from event-loop blocked share. UNVERIFIED.
jafra.v2.detect.event-loop-blocked.selector-frames=sun.nio.ch.EPoll.wait,sun.nio.ch.EPollSelectorImpl.doSelect,io.netty.channel.epoll.Native.epollWait,io.netty.channel.nio.NioEventLoop.select
# proposal, pending KUSMA. pinning_burst minimum pin count.
jafra.v2.detect.pinning-burst.min-count=10
# proposal, pending KUSMA. pinning_burst warning share percent.
jafra.v2.detect.pinning-burst.warning-pct=10
# proposal, pending KUSMA. pinning_burst critical share percent.
jafra.v2.detect.pinning-burst.critical-pct=50
# proposal, pending KUSMA. ttsp_spike warning floor, milliseconds.
jafra.v2.detect.ttsp-spike.warning-ms=50
# proposal, pending KUSMA. ttsp_spike critical milliseconds.
jafra.v2.detect.ttsp-spike.critical-ms=500
# proposal, pending KUSMA. ttsp_spike multiple of baseline p99.
jafra.v2.detect.ttsp-spike.p99-multiple=5
# proposal, pending KUSMA. ttsp_spike minimum safepoints before the p99 term applies.
jafra.v2.detect.ttsp-spike.min-safepoints=50
# proposal, pending KUSMA. ttsp_spike minimum baseline windows before the p99 term applies.
jafra.v2.detect.ttsp-spike.min-windows=60
# proposal, pending KUSMA. safepoint_overhead warning percent.
jafra.v2.detect.safepoint-overhead.warning-pct=5
# proposal, pending KUSMA. safepoint_overhead critical percent.
jafra.v2.detect.safepoint-overhead.critical-pct=15
# proposal, pending KUSMA. deopt_storm warning deopts per second.
jafra.v2.detect.deopt-storm.warning-per-s=20
# proposal, pending KUSMA. deopt_storm robust z.
jafra.v2.detect.deopt-storm.z=4
# proposal, pending KUSMA. deopt_storm critical when one method has this many deopts.
jafra.v2.detect.deopt-storm.critical-count=50
# proposal, pending KUSMA. frames that mark deopt_storm as self instrumentation. UNVERIFIED.
jafra.v2.detect.deopt-storm.self-frames=jdk.jfr.internal.,io.jafra.
# proposal, pending KUSMA. jit_backlog compiler queue size. JDK 25 only.
jafra.v2.detect.jit-backlog.queue-size=500
# proposal, pending KUSMA. class_load_burst classes per second.
jafra.v2.detect.class-load-burst.per-s=100
# proposal, pending KUSMA. class_load_burst robust z.
jafra.v2.detect.class-load-burst.z=4
# proposal, pending KUSMA. class_load_burst ignored before this many seconds of uptime.
jafra.v2.detect.class-load-burst.min-uptime-s=600
# proposal, pending KUSMA. class_unload_burst classes per second.
jafra.v2.detect.class-unload-burst.per-s=100
# proposal, pending KUSMA. slow_peer warning thread-seconds per second.
jafra.v2.detect.slow-peer.warning-thread-s=0.5
# proposal, pending KUSMA. slow_peer critical thread-seconds per second.
jafra.v2.detect.slow-peer.critical-thread-s=2
# proposal, pending KUSMA. slow_peer per-peer robust z.
jafra.v2.detect.slow-peer.z=4
# proposal, pending KUSMA. tls_churn handshakes per second.
jafra.v2.detect.tls-churn.per-s=20
# proposal, pending KUSMA. slow_file_io warning thread-seconds per second.
jafra.v2.detect.slow-file-io.warning-thread-s=0.2
# proposal, pending KUSMA. slow_file_io critical thread-seconds per second.
jafra.v2.detect.slow-file-io.critical-thread-s=1
# proposal, pending KUSMA. slow_file_io log path regex.
jafra.v2.detect.slow-file-io.log-path=(?i)(\.log$|/logs?/)
# proposal, pending KUSMA. exception_storm exceptions per second.
jafra.v2.detect.exception-storm.warning-per-s=1000
# proposal, pending KUSMA. exception_storm robust z.
jafra.v2.detect.exception-storm.z=4
# proposal, pending KUSMA. exception_storm fillInStackTrace share of CPU samples.
jafra.v2.detect.exception-storm.fill-pct=10
# proposal, pending KUSMA. exception_storm minimum CPU samples for the critical share.
jafra.v2.detect.exception-storm.min-samples=200
# proposal, pending KUSMA. endpoint_slowdown minimum calls.
jafra.v2.detect.endpoint-slowdown.min-calls=20
# proposal, pending KUSMA. endpoint_slowdown warning multiple of the median average.
jafra.v2.detect.endpoint-slowdown.warning-multiple=2
# proposal, pending KUSMA. endpoint_slowdown robust z.
jafra.v2.detect.endpoint-slowdown.z=4
# proposal, pending KUSMA. endpoint_slowdown critical multiple of the median for the max.
jafra.v2.detect.endpoint-slowdown.critical-max-multiple=10
# proposal, pending KUSMA. endpoint_slowdown critical multiple of the median for the average.
jafra.v2.detect.endpoint-slowdown.critical-avg-multiple=3
# proposal, pending KUSMA. slow_requests warning share percent.
jafra.v2.detect.slow-requests.warning-pct=5
# proposal, pending KUSMA. slow_requests critical share percent.
jafra.v2.detect.slow-requests.critical-pct=25
# proposal, pending KUSMA. slow_requests minimum slow calls.
jafra.v2.detect.slow-requests.min-slow=5
# proposal, pending KUSMA. slow_requests default MethodTrace threshold, milliseconds.
jafra.v2.detect.slow-requests.default-threshold-ms=500
# How often an open stream emits event: heartbeat. Default 15s.
jafra.v2.stream-heartbeat=15s
%test.jafra.v2.detect.long-pause.warning-ms=0
%test.jafra.v2.stream-heartbeat=1s
