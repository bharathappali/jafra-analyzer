quarkus.http.port=8080
quarkus.grpc.server.port=9090
quarkus.grpc.server.host=0.0.0.0
quarkus.http.host=0.0.0.0
quarkus.log.console.json=true
quarkus.micrometer.export.prometheus.enabled=true
jafra.ingest.max-metadata-length=4096
jafra.ingest.max-active-streams=32
jafra.storage.root=/var/lib/jafra/analyzer
jafra.decode.lanes=4
jafra.duckdb.memory-limit=256MB
jafra.duckdb.threads=1
jafra.rollup.pause-backlog=64
jafra.compact.min-age=1h
jafra.compact.interval=10m
jafra.retention.mode=delete-after-48h
jafra.retention.raw-ttl=48h
jafra.retention.clear-parquet-cache=false
jafra.retention.sweep-interval=10m
quarkus.http.enable-compression=true
%test.jafra.storage.root=target/jafra-analyzer-storage
%test.jafra.retention.mode=never
